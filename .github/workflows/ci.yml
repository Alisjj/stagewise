name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o stagewise ./cmd/stagewise

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -o dist/stagewise-darwin-arm64 ./cmd/stagewise
          GOOS=darwin GOARCH=amd64 go build -o dist/stagewise-darwin-amd64 ./cmd/stagewise
          GOOS=linux GOARCH=amd64 go build -o dist/stagewise-linux-amd64 ./cmd/stagewise
          GOOS=linux GOARCH=arm64 go build -o dist/stagewise-linux-arm64 ./cmd/stagewise
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
